# 조회설정.toml · 여기만 고치고 VS Code 에서 F5 → 「설정파일로 조회」
#
# src     원본 CSV. 여러 개, *.csv 패턴 가능. 상대 경로는 이 파일이 있는 폴더 기준
# [["조회"]] 블록마다 조회 범위 하나. 블록끼리는 합쳐서 한 작업으로 돈다
#   "구" · "동" · "등급" · id 중 쓴 것만 적용. 생략하면 그 항목은 전체
#   같은 항목 안의 여러 값은 「또는」, 서로 다른 항목끼리는 「그리고」
#   동은 CSV에 적힌 법정동 이름 그대로 (예: 북성동1가). 틀리면 비슷한 이름을 추천함
#
# 주의 · TOML 문법에서 한글 이름은 따옴표로 감싸야 한다. [["조회"]], "구" = [...] 처럼 쓴다
#        (영어 이름도 됨: [[query]], gu, dong, rank, id)

src = ["../../대상 파일/콜리스트_인천광역시_미추홀구_2026-09-30.csv"]

# 작업 상태 폴더와 결과 폴더 (이 파일 기준 상대 경로 가능)
work = "work"
out = "results"

# 카카오 동시 조회 수 1~4
workers = 4
# true 면 네이버 지오코딩을 건너뜀
skip_geo = false
# 같은 범위를 처음부터 다시 조회하고 싶을 때만 이름을 바꿔 적음
run_tag = ""
# 114On 추가 조회 범위 · no_rep: 대표번호가 없는 행 전부 · no_proxy: 대표번호도 대리 연락처도 없는 행만
scope114 = "no_rep"

[["조회"]]
"구" = ["중구"]
"동" = ["운서동", "중산동"]
"등급" = ["S", "A"]

[["조회"]]
"구" = ["미추홀구"]      # 동을 생략하면 그 구 전체
"등급" = ["B"]
